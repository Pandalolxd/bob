{% extends "layout.html" %}

{% block title %}Identify a Place{% endblock %}

{% block content %}
<div class="user-interface">
    <header class="main-header">
        <h1>Place Recognition AI</h1>
        <p>Upload a photo of a landmark, and our AI will tell you what it is.</p>
    </header>

    <div class="upload-section">
        <form id="upload-form" enctype="multipart/form-data">
            <label for="image-upload" class="custom-file-upload">
                Choose Image
            </label>
            <input id="image-upload" name="image" type="file" accept="image/*" required>
            <button type="submit">Identify</button>
        </form>
        <p id="file-name" class="file-name-display"></p>
    </div>

    <div id="result-section" class="result-section" style="display:none;">
        <h2>Result</h2>
        <div id="result-content">
            <!-- Results will be injected here by JavaScript -->
        </div>
    </div>

    <div id="loading-spinner" class="loading-spinner" style="display:none;"></div>
</div>

<script src="{{ url_for('static', filename='main.js') }}"></script>
{% endblock %}
