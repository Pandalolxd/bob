{% extends "layout.html" %}

{% block title %}Identify a Place{% endblock %}

{% block content %}
<nav class="top-nav">
    <a href="{{ url_for('login') }}" class="button-nav">Admin Panel</a>
</nav>

<main class="main-container">
    <div class="hero-section">
        <h1 class="fade-in">AI Place Recognition</h1>
        <p class="fade-in-delay">Discover landmarks with a single photo. Upload an image or use your camera.</p>
    </div>

    <div class="card interactive-card">
        <div class="card-header">
            <h3>Start Identification</h3>
        </div>
        <div class="card-body">
            <form id="upload-form" enctype="multipart/form-data">
                <div class="form-actions">
                    <label for="image-upload" class="button button-primary">
                        <i data-feather="upload"></i> Choose Image
                    </label>
                    <input id="image-upload" name="image" type="file" accept="image/*" hidden>
                    <button type="button" id="start-camera" class="button button-secondary">
                        <i data-feather="camera"></i> Use Camera
                    </button>
                    <button type="submit" class="button button-cta">
                        <i data-feather="search"></i> Identify
                    </button>
                </div>
                <p id="file-name" class="file-name-display"></p>
            </form>
        </div>
    </div>

    <div id="camera-section" class="camera-section card" style="display:none;">
        <video id="camera-feed" class="camera-view" autoplay playsinline></video>
        <button id="capture-btn" class="button button-capture"><i data-feather="circle"></i> Capture</button>
        <canvas id="image-canvas" style="display:none;"></canvas>
    </div>

    <div id="loading-spinner" class="spinner-container" style="display:none;">
        <div class="spinner"></div>
    </div>

    <div id="result-section" class="result-card card" style="display:none;">
        <div class="card-header">
            <h2>Recognition Result</h2>
        </div>
        <div id="result-content" class="card-body">
            <!-- Results will be injected here -->
        </div>
    </div>
</main>

<script src="{{ url_for('static', filename='main.js') }}"></script>
<script src="{{ url_for('static', filename='js/camera.js') }}"></script>
{% endblock %}
